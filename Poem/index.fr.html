<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Poèmes</title>
  <link href="https://fonts.googleapis.com/css2?family=Garamond:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      direction: ltr;
      font-family: 'Garamond', serif;
      background: linear-gradient(to bottom, #f9fcf9, #eaf5ea);
      margin: 0;
      padding: 0;
      line-height: 1.7;
      color: #2c5f45;
    }

    header {
      text-align: center;
      padding: 50px 20px 20px;
      background-color: #e0f0e7;
      border-bottom: 2px solid #b3d4c0;
      position: relative;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: #2c5f45;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .back-link {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 22px;
      color: #3a7544;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #2c5f45;
    }

    .back-link::before {
      content: "🏠";
      font-size: 28px;
      line-height: 1;
    }

    .poem-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 50px 20px;
    }

    .poem-card {
      background-color: #ffffff;
      border: 2px solid #a5ccb6;
      border-radius: 15px;
      padding: 30px 25px;
      width: 260px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .poem-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .poem-icon {
      font-size: 65px;
      color: #4d7f62;
      margin-bottom: 25px;
    }

    .poem-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #2f4f3d;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .poem-link {
      text-decoration: none;
      color: #ffffff;
      background-color: #679b79;
      padding: 12px 26px;
      border-radius: 12px;
      font-size: 16px;
      display: inline-block;
      transition: background-color 0.3s;
    }

    .poem-link:hover {
      background-color: #4d7f62;
    }

    .footer-img {
      text-align: center;
      padding: 50px 20px;
      background-color: #f2f9f4;
    }

    .footer-img img {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
      border: 2px solid #c2dfd0;
    }

    @media (max-width: 600px) {
      .poem-card {
        width: 90%;
      }
      .back-link {
        position: static;
        margin: 20px auto 0;
        display: inline-flex;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="/Takam/index.fr.html">Accueil</a>
    <h1>Poèmes</h1>
  </header>

  <section class="poem-list">
    <div class="poem-card">
      <div class="poem-icon">🌿</div>
      <div class="poem-title">Takam</div>
      <a href="P1.fr.html" class="poem-link">Voir le poème</a>
    </div>
    <div class="poem-card">
      <div class="poem-icon">🌺</div>
      <div class="poem-title">Ah Takam, je te chante !</div>
      <a href="P2.fr.html" class="poem-link">Voir le poème</a>
    </div>
    <div class="poem-card">
      <div class="poem-icon">☘️</div>
      <div class="poem-title">Shoupe</div>
      <a href="P3.fr.html" class="poem-link">Voir le poème</a>
    </div>
    <div class="poem-card">
      <div class="poem-icon">💥</div>
      <div class="poem-title">La Vie</div>
      <a href="P4.fr.html" class="poem-link">Voir le poème</a>
    </div>
  </section>

  <div class="footer-img">
    <img src="https://i.imgur.com/kfhgKqX.jpeg" alt="Paysage natal de Takam" />
  </div>
</body>
</html>
